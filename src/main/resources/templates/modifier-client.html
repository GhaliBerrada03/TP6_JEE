<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mise à jour du dossier client</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <style>
        :root {
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --surface: #f8fafc;
            --text-main: #1e293b;
            --line: #cbd5e1;
            --alert: #ef4444;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--text-main);
            margin: 0;
            padding: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .form-shell {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-bottom: 2rem; font-size: 1.25rem; font-weight: 700; text-align: center; }
        
        .field { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: #64748b; }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--line);
            border-radius: 0.5rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .error { color: var(--alert); font-size: 0.75rem; margin-top: 0.25rem; font-weight: 500; }
        
        .btn-update {
            width: 100%;
            background-color: var(--brand);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .btn-update:hover { background-color: var(--brand-hover); }
        
        .back-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #64748b; text-decoration: none; }
        .back-link:hover { color: var(--brand); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-shell">
        <h2>Édition d'un compte client</h2>
        <form action="#" th:action="@{/mettre-a-jour/{id}(id=${client.id})}" th:object="${client}" method="post">
            <div class="field">
                <label for="nom">Nom à rectifier</label>
                <input type="text" th:field="*{nom}" id="nom" placeholder="Ex: Jean Dupont">
                <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="error">Erreur</span>
            </div>
            
            <div class="field">
                <label for="courriel">Nouveau courriel de contact</label>
                <input type="email" th:field="*{courriel}" id="courriel" placeholder="client@exemple.com">
                <span th:if="${#fields.hasErrors('courriel')}" th:errors="*{courriel}" class="error">Erreur</span>
            </div>
            
            <button type="submit" class="btn-update">Appliquer les changements</button>
            <a href="/liste-clients" class="back-link">Revenir sans enregistrer</a>
        </form>
    </div>
</body>
</html>
